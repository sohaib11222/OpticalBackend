; Install as /etc/supervisor/conf.d/vistaexpressbusiness-worker.conf.
; This replaces ONLY the Vista Express 360 worker; other projects are untouched.
[program:vistaexpressbusiness-worker]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /var/www/vistaexpressbusiness/backend/artisan queue:work database --queue=uploads,integrations,communications,default --sleep=3 --tries=3 --timeout=300 --max-time=3600
directory=/var/www/vistaexpressbusiness/backend
user=www-data
numprocs=2
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=360
redirect_stderr=true
stdout_logfile=/var/www/vistaexpressbusiness/backend/storage/logs/worker_%(process_num)02d.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
